# SchemaBridge local workbench settings.
# Run Streamlit from the repository root to load this configuration.
[server]
address = "127.0.0.1"
port = 8501
headless = false

[browser]
gatherUsageStats = false

# Use the application's audited export flow instead of Streamlit's table toolbar.
[client]
disableDataExport = true

# Light workspace theme and navy navigation.
[theme]
base = "light"
primaryColor = "#2059CB"
backgroundColor = "#F2F6FB"
textColor = "#152B47"
dataframeHeaderBackgroundColor = "#E9F0F7"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#10243E"
textColor = "#F5F9FF"
primaryColor = "#65D5D1"
